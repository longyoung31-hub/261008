<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皮皮珠介紹網站</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(180deg, #fff7fb 0%, #ffe5ec 38%, #fff8e8 100%);
      color: #533a35;
    }

    body {
      min-height: 100vh;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      padding: 14px 28px;
      box-shadow: 0 8px 18px rgba(169, 116, 129, 0.12);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #d96f8f;
    }

    nav {
      display: flex;
      gap: 24px;
      font-weight: 700;
      color: #7d5b62;
    }

    nav a {
      text-decoration: none;
      color: inherit;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      padding: 60px 0 30px;
    }

    .title-box h1 {
      margin: 0 0 16px;
      font-size: clamp(2.7rem, 4vw, 4.4rem);
      line-height: 1.1;
      color: #3a2b2b;
    }

    .title-box h1 .highlight {
      color: #d76688;
    }

    .subtitle {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #6d4e58;
      max-width: 540px;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      border: 2px solid transparent;
      transition: 0.2s ease;
    }

    .btn.primary {
      background: linear-gradient(135deg, #ff93af, #f5bf7d);
      color: white;
      box-shadow: 0 12px 20px rgba(223, 140, 160, 0.25);
    }

    .btn.secondary {
      border-color: #e5a7b8;
      color: #af5f7e;
      background: rgba(255,255,255,0.4);
    }

    .portrait-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 520px;
    }

    .portrait {
      position: relative;
      width: 420px;
      height: 430px;
    }

    .hat {
      position: absolute;
      left: 50%;
      top: 10px;
      width: 200px;
      height: 90px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f5d94e, #f0b93c);
      border: 6px solid #e69b2a;
      border-radius: 46% 46% 18% 18% / 80% 80% 20% 20%;
      box-shadow: inset 0 -10px 0 rgba(255,255,255,0.3);
      z-index: 5;
    }

    .hat::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 140px;
      height: 26px;
      transform: translateX(-50%);
      background: #f59b2f;
      border-radius: 18px;
    }

    .hat::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 12px;
      width: 120px;
      height: 18px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.4);
      border-radius: 999px;
    }

    .pig {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 300px;
      height: 300px;
      transform: translateX(-50%);
    }

    .body {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 250px;
      height: 210px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f9d0db, #f4b8c8);
      border: 6px solid #ef9bb3;
      border-radius: 48% 52% 44% 56% / 56% 58% 42% 44%;
      bddox-shadow: inset 0 -12px 0 rgba(255,255,255,0.2);
    }

    .head {
      position: absolute;
      left: 50%;
      top: 34px;
      width: 240px;
      height: 200px;
      transform: translateX(-50%);
      background: #f9c8d5;
      border: 6px solid #ef9bb3;
      border-radius: 48% 52% 50% 50% / 54% 55% 45% 46%;
      z-index: 2;
    }

    .ear {
      position: absolute;
      top: 0;
      width: 56px;
      height: 56px;
      background: #f5a7b8;
      border: 6px solid #ef9bb3;
      border-radius: 50%;
      z-index: 1;
    }

    .ear.left { left: 24px; }
    .ear.right { right: 24px; }

    .ear::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      background: #ffd7e3;
      border-radius: 50%;
    }

    .eye {
      position: absolute;
      top: 85px;
      width: 22px;
      height: 28px;
      background: #1f1c1d;
      border-radius: 50%;
      z-index: 3;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      left: 4px;
      top: 5px;
    }

    .eye.left { left: 72px; }
    .eye.right { right: 72px; }

    .cheek {
      position: absolute;
      top: 126px;
      width: 34px;
      height: 20px;
      background: rgba(255, 140, 170, 0.55);
      border-radius: 50%;
      z-index: 3;
    }

    .cheek.left { left: 36px; }
    .cheek.right { right: 36px; }

    .snout {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 110px;
      height: 82px;
      transform: translateX(-50%);
      background: #ffeaf0;
      border: 6px solid #ee9bb2;
      border-radius: 46% 46% 50% 50% / 52% 52% 48% 48%;
      z-index: 3;
    }

    .snout::before,
    .snout::after {
      content: "";
      position: absolute;
      top: 22px;
      width: 18px;
      height: 24px;
      background: #f5a7be;
      border-radius: 50%;
    }

    .snout::before { left: 22px; }
    .snout::after { right: 22px; }

    .nose {
      position: absolute;
      left: 50%;
      top: 14px;
      width: 28px;
      height: 18px;
      transform: translateX(-50%);
      background: #ef7398;
      border-radius: 50% 50% 60% 60%;
    }

    .mouth {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 44px;
      height: 22px;
      transform: translateX(-50%);
      border-bottom: 4px solid #d66c89;
      border-radius: 0 0 30px 30px;
    }

    .leg {
      position: absolute;
      bottom: 0;
      width: 30px;
      height: 60px;
      background: #f7b7c8;
      border: 5px solid #ef9bb3;
      border-radius: 18px;
      z-index: 0;
    }

    .leg.left { left: 86px; }
    .leg.center { left: 50%; transform: translateX(-50%); }
    .leg.right { right: 86px; }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 22px;
      margin-top: 42px;
    }

    .card {
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(202, 150, 167, 0.4);
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: 0 12px 28px rgba(172, 120, 136, 0.08);
    }

    .card .label {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffe2ec;
      color: #b76480;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      color: #50363c;
    }

    .card p {
      margin: 0;
      line-height: 1.8;
      color: #6d4e58;
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .buttons {
        justify-content: center;
      }

      .topbar {
        flex-direction: column;
        gap: 12px;
        border-radius: 24px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">皮皮珠</div>
      <nav>
        <a href="#about">關於我</a>
        <a href="#traits">特色</a>
        <a href="#contact">聯絡</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="title-box">
          <h1>你好，我是 <span class="highlight">皮皮珠</span></h1>
          <p class="subtitle">
            皮皮珠帶著一頂可愛的皮皮帽子，像小太陽一樣暖心，總是笑得甜甜，喜歡陪大家一起冒險、一起玩樂、一起度過每個美好的日子。
          </p>
          <div class="buttons">
            <a class="btn primary" href="#about">認識皮皮珠</a>
            <a class="btn secondary" href="#traits">查看特色</a>
          </div>
        </div>

        <div class="portrait-wrap">
          <div class="portrait">
            <div class="hat"></div>
            <div class="pig">
              <div class="ear left"></div>
              <div class="ear right"></div>
              <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
                <div class="snout">
                  <div class="nose"></div>
                  <div class="mouth"></div>
                </div>
              </div>
              <div class="body"></div>
              <div class="leg left"></div>
              <div class="leg center"></div>
              <div class="leg right"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="features" id="traits">
        <article class="card">
          <div class="label">個性</div>
          <h3>活潑開朗</h3>
          <p>皮皮珠總是帶著陽光般的笑容，遇到新朋友一定先打招呼，熱情又親切。</p>
        </article>

        <article class="card">
          <div class="label">愛好</div>
          <h3>快樂冒險</h3>
          <p>喜歡追逐風、踩著雲朵、探索新地方，還有最愛的就是和朋友一起大笑。</p>
        </article>

        <article class="card">
          <div class="label">魅力</div>
          <h3>甜美可愛</h3>
          <p>一頂皮皮帽子、一雙大眼睛、圓圓鼻子，讓每個人一見鍾情。</p>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
